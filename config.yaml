# CLIProxyAPI v8 configuration. Replace example credentials before deployment.
config-version: 8
server:
  host: ''
  port: 8317
  tls:
    enable: false
    cert: ''
    key: ''
  commercial-mode: false
management:
  allow-remote: true
  secret-key: 19960106whs
  disable-control-panel: false
  panel-github-repository: https://github.com/router-for-me/Cli-Proxy-API-Management-Center
access:
  api-keys:
  - your-api-key-1
  - your-api-key-2
  - your-api-key-3
oauth:
  auth-dir: ~/.cli-proxy-api
  model-alias:
    antigravity:
    - name: rev19-uic3-1p
      alias: gemini-2.5-computer-use-preview-10-2025
    - name: gemini-3-pro-image
      alias: gemini-3-pro-image-preview
    - name: gemini-3-pro-high
      alias: gemini-3-pro-preview
    - name: gemini-3-flash
      alias: gemini-3-flash-preview
    - name: claude-sonnet-4-5
      alias: gemini-claude-sonnet-4-5
    - name: claude-sonnet-4-5-thinking
      alias: gemini-claude-sonnet-4-5-thinking
    - name: claude-opus-4-5-thinking
      alias: gemini-claude-opus-4-5-thinking
  excluded-models:
    gemini-cli:
    - gemini-2.5-pro
    - gemini-2.5-*
    - '*-preview'
    - '*flash*'
    vertex:
    - gemini-3-pro-preview
    aistudio:
    - gemini-3-pro-preview
    antigravity:
    - gemini-3-pro-preview
    claude:
    - claude-3-5-haiku-20241022
    codex:
    - gpt-5-codex-mini
    qwen:
    - vision-model
    iflow:
    - tstars2.0
  providers:
    aistudio:
      ws-auth: false
observability:
  logs:
    debug: false
    logging-to-file: false
    logs-max-total-size-mb: 0
  usage:
    usage-statistics-enabled: false
requests:
  proxy-url: ''
  nonstream-keepalive-interval: 0
  streaming:
    keepalive-seconds: 15
    bootstrap-retries: 1
  payload:
    default:
    - models:
      - name: gemini-2.5-pro
        protocol: gemini
      params:
        generationConfig.thinkingConfig.thinkingBudget: 32768
    default-raw:
    - models:
      - name: gemini-2.5-pro
        protocol: gemini
      params:
        generationConfig.responseJsonSchema: '{"type":"object","properties":{"answer":{"type":"string"}}}'
    override:
    - models:
      - name: gpt-*
        protocol: codex
      params:
        reasoning.effort: high
    override-raw:
    - models:
      - name: gpt-*
        protocol: codex
      params:
        response_format: '{"type":"json_schema","json_schema":{"name":"answer","schema":{"type":"object"}}}'
    filter:
    - models:
      - name: gemini-2.5-pro
        protocol: gemini
      params:
      - generationConfig.thinkingConfig.thinkingBudget
      - generationConfig.responseJsonSchema
routing:
  force-model-prefix: false
  retry:
    request-retry: 3
    max-retry-interval: 30
  strategy: round-robin
quota-exceeded:
  switch-project: true
  switch-preview-model: true
api-keys:
  gemini:
  - name: gemini-1
    prefix: test
    base-url: https://generativelanguage.googleapis.com
    headers:
      X-Custom-Header: custom-value
    proxy-url: socks5://proxy.example.com:1080
    models:
    - name: gemini-2.5-flash
      alias: gemini-flash
    excluded-models:
    - gemini-2.5-pro
    - gemini-2.5-*
    - '*-preview'
    - '*flash*'
    keys:
    - api-key: AIzaSy...01
  - name: gemini-2
    keys:
    - api-key: AIzaSy...02
  vertex:
  - name: vertex-1
    prefix: test
    base-url: https://example.com/api
    proxy-url: socks5://proxy.example.com:1080
    headers:
      X-Custom-Header: custom-value
    models:
    - name: gemini-2.5-flash
      alias: vertex-flash
    - name: gemini-2.5-pro
      alias: vertex-pro
    keys:
    - api-key: vk-123...
  codex:
  - name: codex-1
    prefix: test
    base-url: https://www.example.com
    headers:
      X-Custom-Header: custom-value
    proxy-url: socks5://proxy.example.com:1080
    models:
    - name: gpt-5-codex
      alias: codex-latest
    excluded-models:
    - gpt-5.1
    - gpt-5-*
    - '*-mini'
    - '*codex*'
    keys:
    - api-key: sk-atSM...
  claude:
  - name: claude-1
    keys:
    - api-key: sk-atSM...
  - name: claude-2
    prefix: test
    base-url: https://www.example.com
    headers:
      X-Custom-Header: custom-value
    proxy-url: socks5://proxy.example.com:1080
    models:
    - name: claude-3-5-sonnet-20241022
      alias: claude-sonnet-latest
    excluded-models:
    - claude-opus-4-5-20251101
    - claude-3-*
    - '*-thinking'
    - '*haiku*'
    keys:
    - api-key: sk-atSM...
      cloak:
        mode: auto
        strict-mode: false
        sensitive-words:
        - API
        - proxy
  openai-compatibility:
  - name: openrouter
    prefix: test
    base-url: https://openrouter.ai/api/v1
    headers:
      X-Custom-Header: custom-value
    models:
    - name: moonshotai/kimi-k2:free
      alias: kimi-k2
    keys:
    - api-key: sk-or-v1-...b780
      proxy-url: socks5://proxy.example.com:1080
    - api-key: sk-or-v1-...b781

